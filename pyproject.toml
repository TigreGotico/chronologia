[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronologia"
version = "0.1.0a1"
description = "General-purpose calendrical and chronological core: unbounded datetime-compatible dates, half-open time spans, and a JDN calendar/era/regnal/cycle registry."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "TigreGotico" }]
keywords = ["calendar", "datetime", "julian-day", "eras", "chronology", "astronomical-year"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Natural-language date extraction (chronologia.extract / extract_timespan)
# needs two runtime helpers: ovos-number-parser turns spelled numbers into
# digits inside the tokenizer, and ovos-spec-tools loads the per-language
# .voc vocabulary bundles under chronologia/locale/. The calendrical core
# (dates, spans, calendars, eras) still runs on the standard library alone.
dependencies = [
    "ovos-number-parser>=0.19.7a2",
    "ovos-spec-tools>=1.5.0a1",
]

[project.optional-dependencies]
# Test/dev extras: property-based fuzzing (test/test_properties.py) needs
# Hypothesis; the rest of the suite runs on pytest alone.
test = [
    "pytest",
    "hypothesis>=6.0",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis>=6.0",
    "mypy",
]

[tool.setuptools]
packages = ["chronologia", "chronologia.data", "chronologia.extract"]

[tool.setuptools.package-data]
chronologia = ["py.typed", "calendar_data/*", "holiday_data/*", "locale/*/*.voc", "locale/*/*.json"]
"chronologia.data" = ["*.tab"]
