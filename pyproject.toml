[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronologia"
dynamic = ["version"]
description = "General-purpose calendrical and chronological core: unbounded datetime-compatible dates, half-open time spans, and a JDN calendar/era/regnal/cycle registry."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "TigreGotico" }]
keywords = ["calendar", "datetime", "julian-day", "eras", "chronology", "astronomical-year"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Natural-language date extraction (chronologia.extract / extract_timespan)
# needs two runtime helpers: ovos-number-parser turns spelled numbers into
# digits inside the tokenizer, and ovos-spec-tools loads the per-language
# .voc vocabulary bundles under chronologia/locale/. The calendrical core
# (dates, spans, calendars, eras) still runs on the standard library alone.
dependencies = [
    "ovos-number-parser>=0.19.7a2",
    "ovos-spec-tools>=1.5.0a1",
]

[project.urls]
Homepage = "https://github.com/TigreGotico/chronologia"
Repository = "https://github.com/TigreGotico/chronologia"
Documentation = "https://github.com/TigreGotico/chronologia/tree/master/docs"
Issues = "https://github.com/TigreGotico/chronologia/issues"

[project.scripts]
chronologia = "chronologia.__main__:main"

[project.optional-dependencies]
# Test/dev extras: property-based fuzzing (test/test_properties.py,
# test/test_fuzz.py) needs Hypothesis; the differential benchmark
# (benchmark/) needs dateparser and dateutil as comparison engines
# (dateutil is already a runtime dependency); test/test_packaging.py builds a
# real wheel and imports it, so it needs `build` plus `setuptools`, whose
# backend the build runs uninsulated and which the interpreters that no
# longer bundle it would otherwise lack, and it reads pyproject.toml, so it
# needs the `tomli` backport on the one interpreter without stdlib tomllib;
# the rest of the suite runs on pytest alone.
test = [
    "pytest",
    "hypothesis>=6.0",
    "dateparser>=1.1",
    "build>=1.0",
    "setuptools>=61",
    "tomli>=2.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis>=6.0",
    "dateparser>=1.1",
    "build>=1.0",
    "setuptools>=61",
    "tomli>=2.0; python_version < '3.11'",
    "mypy",
]

# Discovered, never hand-listed: a hand-written package list silently drops a
# subpackage the day someone splits a module into one, and every test still
# passes because the editable install reads the source tree rather than the
# built artefact.  That is exactly how chronologia.civil_holidays came to be
# missing from the wheel, which made the *whole* library unimportable once
# installed (chronologia/__init__.py imports from it).  test_packaging.py
# builds a wheel and imports it in a clean interpreter to keep it that way.
[tool.setuptools.packages.find]
include = ["chronologia*"]

[tool.setuptools.dynamic]
version = { attr = "chronologia.version.VERSION_STR" }

[tool.setuptools.package-data]
chronologia = ["py.typed", "calendar_data/*", "holiday_data/*", "holiday_data/i18n/*", "locale/*/*.voc", "locale/*/*.json"]
"chronologia.data" = ["*.tab"]
