name: Release Alpha and Propose Stable

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish_alpha:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    uses: OpenVoiceOS/gh-automations/.github/workflows/publish-alpha.yml@dev
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
    with:
      branch: 'dev'
      version_file: 'chronologia/version.py'
      update_changelog: true
      publish_prerelease: true
      # Stable releases are cut deliberately through publish_stable.yml
      # (workflow_dispatch, or a push to master), never by promoting an
      # automatically opened proposal, so proposing one on every merge only
      # accumulates pull requests nobody acts on.
      propose_release: false
      changelog_max_issues: 50
      publish_pypi: true
      notify_matrix: true
