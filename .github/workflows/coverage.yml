name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@feat/coverage-timeout-input
    with:
      python_version: '3.11'
      coverage_source: 'chronologia'
      test_path: 'test/'
      install_extras: '.[test]'
      min_coverage: 0
      timeout_minutes: 90
      gh_automations_ref: 'feat/coverage-timeout-input'
