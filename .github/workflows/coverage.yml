name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@feat/coverage-timeout-input
    with:
      python_version: '3.11'
      coverage_source: 'chronologia'
      test_path: 'test/'
      install_extras: '.[test]'
      min_coverage: 0
      timeout_minutes: 120
      pytest_args: >-
        --deselect test/test_extract_robustness.py::test_many_range_connectors_no_recursion
        --deselect test/test_audit_round2.py::test_long_pure_cardinal_run_does_not_blow_up_or_misfold
      gh_automations_ref: 'feat/coverage-timeout-input'
