name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    with:
      python_version: '3.11'
      coverage_source: 'chronologia'
      test_path: 'test/'
      install_extras: '.[test]'
      min_coverage: 0
      timeout_minutes: 120
      pytest_args: >-
        --deselect test/test_dos_and_data_regressions.py::test_long_pure_cardinal_run_does_not_blow_up_or_misfold
